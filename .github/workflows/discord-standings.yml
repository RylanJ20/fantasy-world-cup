name: Discord standings

# Posts a daily standings card to Discord. Runs once a day on a schedule (not on
# every deploy), so the channel gets one clean morning update.
on:
  schedule:
    # 12:00 UTC = 8:00 AM Eastern during the World Cup (EDT). NOTE: GitHub cron
    # is always UTC and does NOT follow daylight saving. Gated to June & July so
    # it only posts during the tournament. Change the time/cadence on this line.
    - cron: "0 12 * 6,7 *"
  workflow_dispatch: # also runnable on demand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
