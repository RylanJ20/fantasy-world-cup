name: Discord standings

# Posts the standings to Discord whenever the data file changes (i.e. when you
# update scores). UI-only commits don't trigger it, so the channel stays quiet
# except for real updates.
on:
  push:
    branches: [main]
    paths:
      - "data/league.ts"
  workflow_dispatch: # lets you trigger a post manually from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Give Vercel time to publish the new deploy so the share image is fresh.
      - run: sleep 90
      - run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
