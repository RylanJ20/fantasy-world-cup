name: Discord standings

# Posts a daily standings card to Discord. Runs once a day on a schedule (not on
# every deploy), so the channel gets one clean morning update.
on:
  # 12:00 UTC = 8:00 AM Eastern during the World Cup (EDT). NOTE: GitHub cron is
  # always UTC and does NOT follow daylight saving. Starts June 12 (the morning
  # after the opener) and runs daily through the end of the tournament.
  schedule:
    - cron: "0 12 12-30 6 *" # June 12–30
    - cron: "0 12 * 7 *" # all of July
  workflow_dispatch: # also runnable on demand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
