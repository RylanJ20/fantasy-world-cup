name: Discord standings

# Manual fallback for the daily standings post. The scheduled morning post now
# runs on Vercel Cron (vercel.json → /api/cron/discord), which fires reliably
# within the 8 AM hour without GitHub's scheduling delays. This workflow stays
# for on-demand posts from the Actions tab.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
