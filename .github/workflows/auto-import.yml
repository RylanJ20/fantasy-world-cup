name: Auto-import results

# Periodically pulls fresh fixtures, group tables + drafted-player stats from
# ESPN's free feed plus Man of the Match from FotMob's free feed and, if anything
# changed (scores, statuses, standings, player stats, MOTM), commits and pushes —
# which triggers a Vercel redeploy. That keeps live scores, finished results, team
# points, player points, group tables and MOTM up to date hands-free.
#
# No API key needed — both ESPN's and FotMob's public endpoints are key-free.
#
# COST / "is it free?":
#   • PUBLIC repo  → GitHub Actions minutes are UNLIMITED and free. Recommended
#     if you want a tight interval for genuinely live scores.
#   • PRIVATE repo → 2000 free minutes/month. Each run is ~1–2 min, so a 15-min
#     cadence across June+July would exceed the free allowance. On private,
#     either widen the interval below (e.g. "*/30" or "0 * * * *") or make the
#     repo public.

on:
  schedule:
    # Every 15 minutes during June & July (UTC). GitHub cron is best-effort and
    # can be delayed a few minutes under load. Edit this line to change cadence.
    - cron: "*/15 * * 6,7 *"
  workflow_dispatch: {} # also runnable on-demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Import fixtures, standings, player/tournament stats (ESPN) + MOTM (FotMob)
        run: npm run import:all
      - name: Commit & push if anything changed
        run: |
          FILES="data/fixtures.json data/groups.json data/player-stats.json data/tournament-leaders.json data/tournament-players.json data/motm.json"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Auto-import: refresh fixtures, standings, player & tournament stats, MOTM"
            git push
            echo "Pushed updated results."
          else
            echo "No changes — nothing to push."
          fi
